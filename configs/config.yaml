# Real-Time AI Face Swap Camera - Application Configuration
# ==========================================================

camera:
  camera_index: 0
  width: 1280
  height: 720
  fps: 30
  backend: "AUTO"  # AUTO, DSHOW (DirectShow), MSMF, V4L2
  auto_reconnect: true
  reconnect_interval_sec: 2.0

performance:
  mode: "quality"  # "performance", "quality", "debug"
  target_fps: 30
  detection_interval: 3  # Run full face detection every N frames during stable tracking
  max_faces: 1  # Version 1 milestone: single face swap
  enable_smoothing: true
  ema_alpha: 0.65  # Exponential moving average factor for landmark smoothing

processing:
  # Mask parameters
  mask_type: "smooth_hull"      # "smooth_hull", "pose_adaptive", "distance_transform", "convex_hull", "elliptical"
  mask_blur: 15                 # Mask feather transition radius
  mask_feather: 0.6             # Feathering strength factor [0.1, 2.0]
  mask_erosion: 1               # Erosion pixels to shrink boundary
  
  # Accelerated Compositing
  use_roi_blending: true        # Fast ROI-bounded warping (5x-10x blending speedup)

  # Color Correction
  color_correction: "reinhard"  # "reinhard", "gain_matching", "histogram", "none"
  color_blend_ratio: 0.70       # Blend factor between original skin tone and swap [0.0, 1.0]
  temporal_color_smoothing: true  # Smooth color transfer parameters across frames (flicker elimination)
  color_smoothing_alpha: 0.70   # EMA smoothing factor for skin tone stability

  # Blending
  blending_method: "multiband"  # "multiband", "alpha", "seamless_clone"
  blending_strength: 1.0        # Overall swap opacity [0.0, 1.0]
  seamless_clone_mode: "NORMAL_CLONE"  # "NORMAL_CLONE", "MIXED_CLONE"

  # Post-Processing & Photorealistic Face Enhancement
  postprocess_sharpen: 0.30     # High-frequency facial clarity enhancement [0.0, 1.0]
  enhancement_strength: 0.60    # Face restoration & detail enhancement strength [0.0, 1.0]
  enhancement_mode: "onnx"      # "onnx" (GFPGAN super-resolution), "adaptive" (zero-latency multi-scale bilateral), "off"
  texture_detail_transfer: 0.35 # High-frequency skin pore & micro-texture transfer [0.0, 1.0]
  illumination_matching: true   # Retinex directional illumination adaptation

  # Phase 6: Occlusion, Stabilization & Multi-Face
  enable_occlusion: true        # Occlusion-aware foreground masking (hands, glasses, cups)
  occlusion_sensitivity: 0.50  # Sensitivity for detecting non-skin foreground items [0.0, 1.0]
  enable_stabilization: true    # Temporal motion and anti-jitter stabilization
  motion_stabilization_alpha: 0.60 # EMA weight for affine motion smoothing [0.1, 1.0]
  multi_face_mode: "primary"    # "primary" (largest), "all" (swap every face), "mapped"

  # Phase 8: Studio Color Grading & Natural Mouth Fidelity
  color_grading_preset: "neutral"    # "neutral", "warm_studio", "cool_daylight", "golden_hour", "cinematic_vibrant", "film_noir"
  color_grading_exposure: 0.0        # [-100.0, 100.0] Brightness offset
  color_grading_contrast: 1.0        # [0.5, 2.0] Contrast multiplier
  color_grading_saturation: 1.0      # [0.0, 2.0] Color vibrancy
  color_grading_temperature: 0.0     # [-100.0, 100.0] Warm Amber (+) to Cool Cyan (-)
  color_grading_tint: 0.0            # [-100.0, 100.0] Magenta (+) to Green (-)
  color_grading_gamma: 1.0           # [0.5, 2.0] Mid-tone gamma curve
  enable_mouth_preservation: true    # Preserve authentic teeth and oral cavity definition
  mouth_preservation_strength: 0.65  # Blending strength [0.0, 1.0]

  # Phase 9: Eye Realism, 3D Pose Adaptation & Specular Lighting
  enable_eye_realism: true           # Natural eye blink synchronization & corneal catchlight injection
  eye_realism_strength: 0.70         # Eye preservation and catchlight intensity [0.0, 1.0]
  enable_pose_adaptation: true       # 3D pose-adaptive boundary clamping & graceful profile falloff
  enable_specular_lighting: true     # Directional diffuse shading and specular highlight transfer
  specular_lighting_strength: 0.50   # Specular and directional lighting intensity [0.0, 1.0]

  # Phase 11: Dynamic Speech & Expression Transfer, Turbo Caching & Buffer Pooling
  enable_expression_transfer: true   # Dynamic speech phoneme aperture, smile energy, and brow dynamics
  expression_transfer_strength: 0.65 # Speech and expression transfer intensity [0.0, 1.0]
  enable_turbo_spatial_caching: true # Sub-pixel transform caching and jitter suppression
  enable_buffer_pool: true           # Zero-allocation frame buffer recycling

virtual_camera:
  enabled: false                # Enable automatic broadcast on app launch
  port: 8080                    # Local port for zero-config HTTP MJPEG stream (http://localhost:8080/stream)
  enable_pyvirtualcam: true     # Hook into OBS VirtualCam DirectShow if available
  enable_mjpeg_stream: true     # Enable network MJPEG stream server for OBS/browsers

runtime:
  preferred_device: "auto"      # "auto", "cuda", "dml", "cpu"
  thread_count: 4
  allow_cpu_fallback: true

storage:
  captures_dir: "outputs/captures"
  recordings_dir: "outputs/recordings"
  benchmarks_dir: "outputs/benchmarks"
